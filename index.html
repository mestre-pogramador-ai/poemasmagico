<style>
* { margin:0; padding:0; box-sizing:border-box; }
:root {
    --bg: #0d0d0d;
    --text: #eaeaea;
    --card: #1a1a2e;
    --accent: #e94560;
    --header-from: #0f0f1a;
    --header-to: #1a1a2e;
    --footer-bg: #0a0a15;
    --nav-bg: rgba(255,255,255,0.08);
    --badge-bg: #e94560;
    --badge-text: #fff;
    --card-hover: #222244;
}
body { font-family:'Inter',sans-serif; background:var(--bg); color:var(--text); line-height:1.7; }
.header { background:linear-gradient(135deg,var(--header-from),var(--header-to)); color:white; position:sticky; top:0; z-index:100; box-shadow:0 2px 20px rgba(0,0,0,0.3); }
.header-inner { max-width:1200px; margin:auto; display:flex; align-items:center; justify-content:space-between; padding:1rem 2rem; }
.header h1 { font-size:1.5rem; font-weight:800; letter-spacing:-0.5px; }
.header h1 a { color:white; text-decoration:none; }
.header nav a { color:rgba(255,255,255,0.8); text-decoration:none; margin-left:1.5rem; font-weight:600; font-size:0.95rem; transition:0.2s; padding:0.4rem 0; border-bottom:2px solid transparent; }
.header nav a:hover { color:white; border-bottom-color:var(--accent); }
.search-box { display:flex; align-items:center; background:rgba(255,255,255,0.12); border-radius:50px; padding:0.3rem 1rem; }
.search-box input { background:none; border:none; color:white; outline:none; padding:0.5rem; width:160px; font-size:0.9rem; }
.search-box input::placeholder { color:rgba(255,255,255,0.6); }
.search-box button { background:none; border:none; color:white; cursor:pointer; font-size:1.1rem; }
.hero { position:relative; width:100%; min-height:420px; display:flex; align-items:flex-end; overflow:hidden; }
.hero-img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
.hero-overlay { position:absolute; inset:0; background:linear-gradient(transparent 30%, rgba(0,0,0,0.85)); }
.hero-content { position:relative; z-index:2; max-width:1200px; margin:auto; padding:3rem 2rem; width:100%; }
.hero-badge { display:inline-block; background:var(--badge-bg); color:var(--badge-text); padding:0.3rem 1rem; border-radius:50px; font-size:0.8rem; font-weight:700; text-transform:uppercase; letter-spacing:0.5px; margin-bottom:1rem; }
.hero h2 { font-size:2.8rem; font-weight:800; color:white; max-width:800px; line-height:1.2; margin-bottom:0.8rem; }
.hero h2 a { color:white; text-decoration:none; }
.hero p { color:rgba(255,255,255,0.85); font-size:1.1rem; max-width:650px; }
.hero-meta { color:rgba(255,255,255,0.6); font-size:0.9rem; margin-top:0.8rem; }
.container { max-width:1200px; margin:2rem auto; padding:0 2rem; }
.section-title { font-size:1.5rem; font-weight:800; margin:2.5rem 0 1.5rem; display:flex; align-items:center; gap:0.8rem; }
.section-title::after { content:''; flex:1; height:2px; background:var(--accent); opacity:0.3; }
.grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(340px,1fr)); gap:1.8rem; }
.card { background:var(--card); border-radius:16px; overflow:hidden; transition:all 0.35s cubic-bezier(0.25,0.46,0.45,0.94); box-shadow:0 4px 20px rgba(0,0,0,0.08); }
.card:hover { transform:translateY(-8px); box-shadow:0 12px 40px rgba(0,0,0,0.15); }
.card-img { width:100%; height:200px; object-fit:cover; display:block; transition:0.4s; }
.card:hover .card-img { transform:scale(1.05); }
.card-img-wrap { overflow:hidden; position:relative; }
.card-badge { position:absolute; top:12px; left:12px; background:var(--badge-bg); color:var(--badge-text); padding:0.25rem 0.9rem; border-radius:50px; font-size:0.75rem; font-weight:700; text-transform:uppercase; letter-spacing:0.3px; z-index:2; }
.card-body { padding:1.5rem; }
.card-body h3 { font-size:1.2rem; font-weight:700; margin-bottom:0.5rem; line-height:1.4; }
.card-body h3 a { color:var(--text); text-decoration:none; }
.card-body h3 a:hover { color:var(--accent); }
.card-body p { color:var(--text); opacity:0.75; font-size:0.95rem; margin-bottom:0.8rem; }
.card-meta { display:flex; align-items:center; gap:1rem; font-size:0.8rem; color:var(--text); opacity:0.5; }
.card-meta span { display:flex; align-items:center; gap:0.3rem; }
.read-more { display:inline-flex; align-items:center; gap:0.4rem; color:var(--accent); font-weight:600; font-size:0.9rem; text-decoration:none; margin-top:0.5rem; transition:0.2s; }
.read-more:hover { gap:0.7rem; }
.featured-grid { display:grid; grid-template-columns:1fr 1fr; gap:1.8rem; margin-bottom:2rem; }
.featured-grid .card:first-child { grid-column:1/2; }
.featured-grid .card:first-child .card-img { height:300px; }
.featured-grid .card:not(:first-child) .card-img { height:200px; }
.tag-filter { display:flex; flex-wrap:wrap; gap:0.5rem; margin-bottom:2rem; }
.tag-btn { background:var(--card); border:1px solid rgba(128,128,128,0.2); color:var(--text); padding:0.4rem 1rem; border-radius:50px; font-size:0.8rem; cursor:pointer; transition:0.2s; font-weight:500; }
.tag-btn:hover, .tag-btn.active { background:var(--accent); color:white; border-color:var(--accent); }
article { max-width:800px; margin:0 auto; }
article h1 { font-size:2.5rem; font-weight:800; line-height:1.2; margin-bottom:1rem; }
article .meta { display:flex; gap:1.5rem; font-size:0.9rem; opacity:0.6; margin-bottom:2rem; flex-wrap:wrap; }
article .featured-img { width:100%; border-radius:16px; margin-bottom:2rem; box-shadow:0 8px 30px rgba(0,0,0,0.15); }
.content-body { font-size:1.05rem; line-height:1.9; }
.content-body h2 { font-size:1.7rem; margin:2.5rem 0 1rem; font-weight:700; }
.content-body h3 { font-size:1.3rem; margin:2rem 0 0.8rem; font-weight:600; }
.content-body p { margin-bottom:1.2rem; }
.content-body img { max-width:100%; height:auto; border-radius:12px; margin:1.5rem 0; box-shadow:0 8px 25px rgba(0,0,0,0.1); }
.content-body pre { background:var(--card); padding:1.5rem; border-radius:12px; overflow-x:auto; border:1px solid rgba(128,128,128,0.1); margin:1.5rem 0; }
.content-body code { background:var(--card); padding:2px 8px; border-radius:6px; font-size:0.9em; }
.content-body pre code { background:none; padding:0; }
.content-body blockquote { border-left:4px solid var(--accent); margin:1.5rem 0; padding:0.8rem 1.5rem; background:var(--card); border-radius:0 12px 12px 0; font-style:italic; }
.content-body ul, .content-body ol { margin:1rem 0 1rem 1.5rem; }
.content-body a { color:var(--accent); }
.back-link { display:inline-flex; align-items:center; gap:0.3rem; color:var(--accent); text-decoration:none; font-weight:600; margin:3rem 0; transition:0.2s; }
.back-link:hover { gap:0.6rem; }
footer { background:var(--footer-bg); color:rgba(255,255,255,0.7); text-align:center; padding:3rem 2rem; margin-top:4rem; font-size:0.9rem; }
footer strong { color:white; }
.empty-hero { padding:6rem 2rem; text-align:center; }
.empty-hero h2 { font-size:2rem; color:var(--text); opacity:0.5; }
@keyframes fadeUp { from { opacity:0; transform:translateY(30px); } to { opacity:1; transform:translateY(0); } }
.card { animation:fadeUp 0.5s ease forwards; }
.card:nth-child(1) { animation-delay:0.05s; }
.card:nth-child(2) { animation-delay:0.1s; }
.card:nth-child(3) { animation-delay:0.15s; }
.card:nth-child(4) { animation-delay:0.2s; }
.card:nth-child(5) { animation-delay:0.25s; }
.card:nth-child(6) { animation-delay:0.3s; }
@media(max-width:768px) { .grid { grid-template-columns:1fr; } .featured-grid { grid-template-columns:1fr; } .header-inner { flex-wrap:wrap; gap:0.8rem; } .search-box input { width:100px; } .hero h2 { font-size:1.8rem; } article h1 { font-size:1.8rem; } }
</style>
<script>
const searchData = [{"title": "teste", "description": "", "content": "", "category": "Sem categoria", "tags": [], "slug": "teste", "images": []}, {"title": "yerg", "description": "vvvvv", "content": "bhyvyvv", "category": "Sem categoria", "tags": ["vvhgv"], "slug": "yerg", "images": []}];
function doSearch(){
  let q=document.getElementById('q').value.toLowerCase().trim();
  let res=document.getElementById('results');
  let grid=document.getElementById('grid');
  if(!q){res.style.display='none';grid.style.display='grid';return;}
  grid.style.display='none';res.style.display='block';
  let h='<h2 class="section-title">Resultados</h2><div class="grid">';let n=0;
  searchData.forEach(i=>{
    if((i.title+' '+i.description+' '+i.content+' '+i.category+' '+i.tags.join(' ')).toLowerCase().includes(q)){
      n++;let img=i.images&&i.images[0]?'<div class="card-img-wrap"><img class="card-img" src="../images/'+i.images[0]+'"></div>':'';
      h+='<div class="card">'+img+'<div class="card-body"><h3><a href="posts/'+i.slug+'.html">'+i.title+'</a></h3><p class="card-meta"><span>'+i.category+'</span></p><p>'+i.description+'</p></div></div>';
    }
  });
  h+=n?'</div>':'<p style="padding:2rem;text-align:center">Nada encontrado.</p>';
  res.innerHTML=h;
}
function filterTag(tag){
  document.getElementById('q').value=tag;
  doSearch();
}
</script>
</head>
<body>
<div class="header" id="top">
  <div class="header-inner">
    <h1><a href="https://mestre-pogramador-ai.github.io/poemasmagico">StaticForge</a></h1>

    <div class="search-box">
      <input type="text" id="q" placeholder="Buscar..." onkeyup="doSearch()">
      <button onclick="doSearch()">🔍</button>
    </div>
  </div>
</div>
<div id="results" style="display:none"></div>

<div class="hero">
  
  <div class="hero-overlay"></div>
  <div class="hero-content">
    <span class="hero-badge" style="background:#e74c3c">Sem categoria</span>
    <h2><a href="posts/yerg.html">yerg</a></h2>
    <p>vvvvv</p>
    <div class="hero-meta">11/07/2026 | 1 min de leitura</div>
  </div>
</div>
<div class="container">
<div class="tag-filter"><button class="tag-btn active" onclick="document.getElementById('q').value='';doSearch();">Todas</button><button class="tag-btn" onclick="filterTag('vvhgv')">vvhgv</button></div><div id="grid" class="grid">
  <div class="card" data-category="Sem categoria" data-tags='[]'>
    <div class="card-img-wrap" style="height:200px;background:var(--card)"></div>
    <div class="card-body">

      <a class="read-more" href="posts/teste.html">Continuar lendo →</a>
    </div>
  </div>

</div></div>
<footer>Gerado com <strong>StaticForge</strong> &mdash; <a href="feed.xml" style="color:rgba(255,255,255,0.5)">RSS Feed</a></footer>
